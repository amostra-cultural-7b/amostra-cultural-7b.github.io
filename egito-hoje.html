<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f3ec" />
    <meta name="description" content="Uma ponte entre a história antiga e o Egito moderno e contemporâneo." />
    <title>Egito hoje · Museu do Egito</title>
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem('egypt-theme');
          const theme = savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch { /* Tema padrão até a interação do visitante. */ }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  </head>
  <body class="page-modern">
    <div id="root" data-page="modern"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
